name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
  pull_request:
    paths:
      - "Backend/**"
  workflow_dispatch:

jobs:
  test:
    name: Build and run backend integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests (no Docker engine required; Docker-dependent tests filtered out)
        run: dotnet test Backend/DockerPanel.API.Tests/DockerPanel.API.Tests.csproj -c Release --filter "category!=docker"
