services:
  dockerpanel:
    image: j4587698/dockerpanel:latest
    container_name: dockerpanel-app
    ports:
      # HTTP-01 ACME 校验必须从公网 80 端口访问；HTTPS 使用 443 提供 SNI 证书服务。
      - "${DOCKERPANEL_HTTP_HOST_PORT:-80}:80"
      - "${DOCKERPANEL_HTTPS_HOST_PORT:-443}:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - HTTP_PORT=80
      - HTTPS_PORT=443
      - ENABLE_HTTPS=true
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
    volumes:
      # 挂载Docker socket以允许管理Docker容器
      - /var/run/docker.sock:/var/run/docker.sock
      # ===== 可选：宿主机监控（默认关闭，全部只读） =====
      # 打开下面几行即可在“概览”页面看到宿主机 CPU/内存/负载/磁盘 I/O/网络。
      # 不挂载时面板只显示容器指标，并提示宿主机监控未启用。
      # - /proc:/host/proc:ro
      # - /sys:/host/sys:ro
      # - /etc/os-release:/host/etc/os-release:ro
      # 可选：仅用于读取宿主机磁盘容量（挂载整个根目录）
      # - /:/host/root:ro
      # 持久化数据存储
      - dockerpanel_data:/app/Data
      # 日志文件
      - dockerpanel_logs:/app/Logs
      # 可选：自定义或新增语言包（文件名即语言代码，如 zh-CN.json）
      # 只需写想覆盖的条目，其余自动沿用内置翻译
      # - ./locales:/app/Locales
    networks:
      - dockerpanel-network
    # 支持 host.docker.internal（Linux 需要）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  dockerpanel_data:
    driver: local
  dockerpanel_logs:
    driver: local

networks:
  dockerpanel-network:
    driver: bridge
    name: dockerpanel-network